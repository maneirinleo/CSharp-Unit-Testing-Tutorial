name: CI .NET 9 - Testes e Cobertura

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Testes e Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências
        run: dotnet restore src/UnitTestingTutorial.slnx

      - name: Compilar solução (Build)
        run: dotnet build src/UnitTestingTutorial.slnx --configuration Release --no-restore

      - name: Executar testes com Cobertura de Código
        run: >
          dotnet test src/UnitTestingTutorial.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publicar Artefato de Cobertura XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-cobertura-xml
          path: ./TestResults/**/coverage.cobertura.xml